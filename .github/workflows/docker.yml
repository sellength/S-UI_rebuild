name: Docker Image CI

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
   
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    # 1. Panel Core Image Metadata and Build/Push
    - name: Docker meta for s-ui
      id: meta-sui
      uses: docker/metadata-action@v5
      with:
        images: |
          sellength/s-ui_dev
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

    - name: Build and push s-ui Panel
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta-sui.outputs.tags }}
        labels: ${{ steps.meta-sui.outputs.labels }}

    # 2. Sing-box Runner Image Metadata and Build/Push
    - name: Docker meta for sing-box
      id: meta-singbox
      uses: docker/metadata-action@v5
      with:
        images: |
          sellength/s-ui_rebuild-singbox
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

    - name: Build and push sing-box
      uses: docker/build-push-action@v6
      with:
        context: core/
        file: core/Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
        tags: ${{ steps.meta-singbox.outputs.tags }}
        labels: ${{ steps.meta-singbox.outputs.labels }}
