name: Release S-UI

on:
  push:
    tags:
      - "*"
    branches:
      - "review"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          cache: false
          go-version: '1.25.5'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          if [ "${{ matrix.platform }}" == "arm64" ]; then
            sudo apt install gcc-aarch64-linux-gnu
          elif [ "${{ matrix.platform }}" == "armv7" ]; then
            sudo apt install gcc-arm-linux-gnueabihf
          elif [ "${{ matrix.platform }}" == "armv6" ]; then
            sudo apt install gcc-arm-linux-gnueabihf
          elif [ "${{ matrix.platform }}" == "armv5" ]; then
            sudo apt install gcc-arm-linux-gnueabi
          elif [ "${{ matrix.platform }}" == "386" ]; then
            sudo apt install gcc-i686-linux-gnu
          elif [ "${{ matrix.platform }}" == "s390x" ]; then
            sudo apt install gcc-s390x-linux-gnu
          fi

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
          cd ..
          mv frontend/dist backend/web/html

      - name: Get latest sing-box release
        id: get_sing_box_release
        run: |
          latest_release=$(curl -Ls "https://api.github.com/repos/SagerNet/sing-box/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$latest_release" ]; then
            echo "Failed to resolve latest sing-box release" >&2
            exit 1
          fi
          echo "latest_release=$latest_release" >> $GITHUB_OUTPUT

      - name: Build s-ui & singbox
        run: |
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=${{ matrix.platform }}
          if [ "${{ matrix.platform }}" == "arm64" ]; then
            export GOARCH=arm64
            export CC=aarch64-linux-gnu-gcc
          elif [ "${{ matrix.platform }}" == "armv7" ]; then
            export GOARCH=arm
            export GOARM=7
            export CC=arm-linux-gnueabihf-gcc
          elif [ "${{ matrix.platform }}" == "armv6" ]; then
            export GOARCH=arm
            export GOARM=6
            export CC=arm-linux-gnueabihf-gcc
          elif [ "${{ matrix.platform }}" == "armv5" ]; then
            export GOARCH=arm
            export GOARM=5
            export CC=arm-linux-gnueabi-gcc
          elif [ "${{ matrix.platform }}" == "386" ]; then
            export GOARCH=386
            export CC=i686-linux-gnu-gcc
          elif [ "${{ matrix.platform }}" == "s390x" ]; then
            export GOARCH=s390x
            export CC=s390x-linux-gnu-gcc
          fi

          #### Build Sing-Box
          export VERSION=${{ steps.get_sing_box_release.outputs.latest_release }}
          git clone -b $VERSION https://github.com/SagerNet/sing-box
          cd sing-box
          go build -tags with_quic,with_grpc,with_wireguard,with_utls,with_acme,with_v2ray_api,with_clash_api,with_gvisor \
          -v -trimpath -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' -s -w -buildid=" \
          -o sing-box ./cmd/sing-box
          cd ..

          ### Build s-ui
          cd backend
          go build -tags postgres -o ../sui main.go
          go build -o ../s-ui-agent-linux-${{ matrix.platform }} ./agent
          cd ..

          mkdir s-ui
          cp sui s-ui/
          cp s-ui.service s-ui/
          cp sing-box.service s-ui/
          mkdir s-ui/bin
          cp sing-box/sing-box s-ui/bin/
          cp core/runSingbox.sh s-ui/bin/

      - name: Package
        run: |
          tar -zcvf s-ui-linux-${{ matrix.platform }}.tar.gz s-ui
          cd sing-box && tar -zcvf ../sing-box-linux-${{ matrix.platform }}.tar.gz sing-box && cd ..

      - name: Upload
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || 'review' }}
          file: s-ui-linux-${{ matrix.platform }}.tar.gz
          asset_name: s-ui-linux-${{ matrix.platform }}.tar.gz
          prerelease: true
          overwrite: true

      - name: Upload Custom Sing-Box
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || 'review' }}
          file: sing-box-linux-${{ matrix.platform }}.tar.gz
          asset_name: sing-box-linux-${{ matrix.platform }}.tar.gz
          prerelease: true
          overwrite: true

      - name: Upload Agent
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || 'review' }}
          file: s-ui-agent-linux-${{ matrix.platform }}
          asset_name: s-ui-agent-linux-${{ matrix.platform }}
          prerelease: true
          overwrite: true
