<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg{fill:#f6f8fb}.panel{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}.muted{fill:#64748b;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.text{fill:#111827;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{fill:#0f172a;font:bold 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h1{fill:#0f172a;font:bold 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#64748b;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.num{fill:#0f172a;font:bold 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.chip{fill:#eef2ff;stroke:#c7d2fe}.greenchip{fill:#dcfce7;stroke:#bbf7d0}.graychip{fill:#f1f5f9;stroke:#e2e8f0}.amberchip{fill:#fef3c7;stroke:#fde68a}.danger{fill:#fef2f2;stroke:#fecaca}.btn{fill:#2563eb}.btn2{fill:#fff;stroke:#d8e0ea}.line{stroke:#e5e7eb;stroke-width:1}.nav{fill:#fff}.navActive{fill:#eaf2ff}.navText{fill:#334155;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.navActiveText{fill:#1d4ed8;font:bold 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <rect class="nav" x="0" y="0" width="220" height="900"/>
  <line x1="220" y1="0" x2="220" y2="900" class="line"/>
  <text class="h1" x="28" y="48">S-UI</text>
  <rect class="navActive" x="16" y="92" rx="8" width="188" height="44"/>
  <text class="navActiveText" x="54" y="120">集群管理</text>
  <text class="navText" x="54" y="176">证书中心</text>
  <text class="navText" x="54" y="228">服务入口</text>
  <text class="navText" x="54" y="280">全局配置</text>
  <text class="navText" x="54" y="332">用户与订阅</text>
  <text class="navText" x="54" y="384">系统设置</text>
  <rect x="250" y="24" width="1160" height="64" rx="10" class="panel"/>
  <text class="h1" x="276" y="64">集群管理</text>
  <rect x="1115" y="38" width="126" height="36" rx="6" class="btn"/>
  <text x="1134" y="62" fill="#fff" font="14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">配置向导 5/5</text>
  <rect x="1254" y="38" width="72" height="36" rx="6" class="btn2"/>
  <text class="muted" x="1277" y="62">刷新</text>
  <rect x="250" y="108" width="1160" height="78" rx="10" class="panel"/>
  <g transform="translate(278 126)"><text class="small" y="18">节点</text><text class="num" y="50">2</text></g>
  <g transform="translate(540 126)"><text class="small" y="18">Agent 在线</text><text class="num" y="50">0</text></g>
  <g transform="translate(805 126)"><text class="small" y="18">健康节点</text><text class="num" y="50">0</text></g>
  <g transform="translate(1070 126)"><text class="small" y="18">已发布配置</text><text class="num" y="50">2</text></g>
  <line x1="510" y1="124" x2="510" y2="170" class="line"/><line x1="775" y1="124" x2="775" y2="170" class="line"/><line x1="1040" y1="124" x2="1040" y2="170" class="line"/>
  <rect x="250" y="210" width="1160" height="548" rx="10" class="panel"/>
  <text class="title" x="278" y="248">节点状态</text>
  <text class="muted" x="278" y="274">内部上报与外部探测分开显示；每一项独立判断，不混成一个状态。</text>
  <rect x="1212" y="230" width="120" height="38" rx="6" class="btn"/>
  <text x="1236" y="255" fill="#fff" font="14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">新增节点</text>
  <line x1="278" y1="306" x2="1382" y2="306" class="line"/>
  <text class="small" x="278" y="334">节点</text><text class="small" x="438" y="334">域名</text><text class="small" x="650" y="334">Agent</text><text class="small" x="760" y="334">Sing-box</text><text class="small" x="890" y="334">配置</text><text class="small" x="1000" y="334">入口</text><text class="small" x="1090" y="334">外部探测</text><text class="small" x="1230" y="334">最后心跳</text><text class="small" x="1340" y="334">操作</text>
  <g transform="translate(278 354)">
    <rect width="1104" height="110" rx="8" fill="#f8fafc" stroke="#e5e7eb"/>
    <text class="text" x="0" y="34" font-weight="bold">US-01</text><text class="small" x="0" y="58">01 · us</text>
    <text class="text" x="160" y="45">ts.test.com</text>
    <rect class="graychip" x="370" y="24" width="82" height="32" rx="16"/><text class="small" x="389" y="45">未接入</text>
    <rect class="graychip" x="480" y="24" width="82" height="32" rx="16"/><text class="small" x="498" y="45">未上报</text>
    <rect class="chip" x="612" y="24" width="58" height="32" rx="16"/><text class="small" x="631" y="45">v2</text>
    <text class="text" x="722" y="45">0</text>
    <rect class="amberchip" x="812" y="24" width="82" height="32" rx="16"/><text class="small" x="831" y="45">未检查</text>
    <text class="text" x="952" y="45">从未上报</text>
    <rect class="btn2" x="1038" y="18" width="48" height="32" rx="6"/><text class="small" x="1050" y="39">编辑</text>
    <rect class="btn" x="1092" y="18" width="78" height="32" rx="6"/><text x="1106" y="39" fill="#fff" font="12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">发布配置</text>
  </g>
  <g transform="translate(278 486)">
    <rect width="1104" height="110" rx="8" fill="#f8fafc" stroke="#e5e7eb"/>
    <text class="text" x="0" y="34" font-weight="bold">SG-01</text><text class="small" x="0" y="58">02 · sg</text>
    <text class="text" x="160" y="45">sg.test.com</text>
    <rect class="greenchip" x="370" y="24" width="70" height="32" rx="16"/><text class="small" x="394" y="45">在线</text>
    <rect class="greenchip" x="480" y="24" width="82" height="32" rx="16"/><text class="small" x="498" y="45">运行中</text>
    <rect class="chip" x="612" y="24" width="58" height="32" rx="16"/><text class="small" x="631" y="45">v4</text>
    <text class="text" x="722" y="45">2</text>
    <rect class="greenchip" x="812" y="24" width="70" height="32" rx="16"/><text class="small" x="836" y="45">正常</text>
    <text class="text" x="952" y="45">30 秒前</text>
    <rect class="btn2" x="1038" y="18" width="48" height="32" rx="6"/><text class="small" x="1050" y="39">编辑</text>
    <rect class="btn" x="1092" y="18" width="78" height="32" rx="6"/><text x="1106" y="39" fill="#fff" font="12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">发布配置</text>
  </g>
  <rect x="250" y="780" width="1160" height="62" rx="10" class="danger"/>
  <text x="278" y="808" fill="#dc2626" font="bold 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Sing-Box Error</text>
  <text x="278" y="832" fill="#b91c1c" font="14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Failed to run journalctl command and sing-box.log reading failed: open /usr/local/s-ui/bin/sing-box.log: no such file or directory</text>
  <rect x="1300" y="798" width="82" height="30" rx="6" fill="#fff" stroke="#fecaca"/><text x="1317" y="818" fill="#dc2626" font="13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">查看日志</text>
</svg>
